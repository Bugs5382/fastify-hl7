name: Release and Publish
# Fires when the maintainer publishes a GitHub Release. By then the Release
# Manager (job-version-bump.yaml) has already bumped package.json and written
# CHANGELOG.md on main, so this workflow only re-tests, publishes to npm via
# OIDC, and republishes the docs. It does not touch the version or changelog.
on:
  workflow_dispatch:
  workflow_call:
  release:
    types:
      - released

permissions:
  contents: read
  id-token: write

jobs:
  Test:
    name: 🧪 Test
    uses: ./.github/workflows/action-test.yaml

  Publish:
    name: 🚀 Publish
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [Test]
    # id-token: write lets npm verify the OIDC token GitHub issues against the
    # trusted publisher registered on npmjs.com -- no NPM_TOKEN.
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org/'

      # OIDC trusted publishing + provenance require npm >= 11.5.1 (the LTS image
      # ships 10.x).
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # The version is already in package.json (set by the Release Manager). A
      # prerelease version (e.g. 4.1.0-beta.1) ships to the `beta` dist-tag,
      # everything else to `latest`. Idempotent: skip if the exact version is
      # already on the registry (partial-publish retry).
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published -- skipping."
          else
            case "$VERSION" in
              *-*) TAG=beta ;;
              *)   TAG=latest ;;
            esac
            npm publish --provenance --access public --ignore-scripts --tag "$TAG"
          fi

  Document:
    name: 📚 Publish Docs
    needs: [Publish]
    uses: ./.github/workflows/action-docs.yaml
