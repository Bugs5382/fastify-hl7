name: Test
# Draft PRs are skipped; the run happens when the PR is marked ready. The job
# still runs for workflow_dispatch and when the publish workflow calls it.
# Pull requests only: nothing reruns on push to main, because the PR run
# already tested the tree being merged.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["**"]
    types: [opened, reopened, ready_for_review, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 🧪 Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24.x, 'lts/*', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Generate the lockfile BEFORE setup-node so its npm cache has something to
      # key on. --legacy-peer-deps keeps CI in parity with local installs that
      # rely on overrides / peer-dep workarounds.
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails if the tarball would ship source maps, source or test paths, no
      # dist/, or goes over the unpacked-size ceiling in scripts/checkPack.mjs.
      - name: Check package contents
        run: npm run check:pack

      # The published set is whatever package.json `files` lists (dist for an app,
      # lib for a library) plus the fixed metadata. Derived, never hardcoded.
      - name: Resolve published files
        id: pkg
        run: |
          {
            echo 'paths<<EOF'
            echo 'package.json'
            echo 'README.md'
            echo 'LICENSE'
            echo 'CHANGELOG.md'
            node -p "(require('./package.json').files || ['dist']).join('\n')"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: matrix.node-version == 'lts/*'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ steps.pkg.outputs.paths }}
